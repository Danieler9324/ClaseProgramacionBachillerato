<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULADORA</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <section class="box">
        <h3>Calculadora</h3>
        <input type="text" name="display" readonly>
        <div class="botones">

            <button>√</button>
            <button>C</button>
            <button id="backspace">⌫</button>
            <button>%</button>
            <button>÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>x</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
            <button>0</button>
            
            <button>(</button>
            <button>)</button>
            <button>^</button>
            <button class="boton-igual">=</button>
            

        </div>
    </section>
</body>
</html>
